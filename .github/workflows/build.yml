# Every push, every day, and on demand: build pico-os's pico compiler,
# compile every package with it into images/ (a package that does not
# compile fails the build), check each program with `picoc -t`, and write
# the indexes again, committing whatever has changed. The board reads
# index.txt, images.txt and the files straight from this repository.
# Daily, so that the programs follow the compiler when pico-os changes.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pico-os, for its compiler
        uses: actions/checkout@v4
        with:
          repository: Andre-cmd-rgb/pico-os
          path: pico-os

      - name: Build the compiler
        run: make -C pico-os/lang

      # From the package's own folder, so the program names its source
      # NAME.pico, as one compiled on the board would.
      - name: Compile every package
        run: |
          picoc="$PWD/pico-os/lang/build/host/picoc"
          rm -rf images && mkdir images
          for dir in packages/*/; do
            name=$(basename "$dir")
            echo "== $name"
            (cd "$dir" && "$picoc" -o "../../images/$name" "$name.pico")
            "$picoc" -t "images/$name"
          done

      - name: Write the indexes
        run: |
          python3 tools/mkindex.py > index.txt
          python3 tools/mkindex.py --images > images.txt

      - name: Commit what changed
        if: github.event_name != 'pull_request'
        run: |
          git add -A index.txt images.txt images
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "programs and indexes: compiled again"
            git push
          fi
